<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meditation Timer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #e0e0e0;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      background: #e94560;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #ffffff;
      line-height: 1.3;
    }
    p {
      font-size: 1rem;
      color: #a0aec0;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #e94560;
      color: #fff;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233,69,96,0.4);
    }
    .number {
      font-size: 4rem;
      font-weight: 800;
      color: rgba(233,69,96,0.2);
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      line-height: 1;
      pointer-events: none;
    }
    .card { position: relative; overflow: hidden; }
  </style>
</head>
<body>
  <div class="card">
    <span class="number">75</span>
    <div class="badge">Project 75</div>
    <h1>Meditation Timer</h1>
    <p>
      This is the homepage for <strong>Meditation Timer</strong>. 
      Build out your features, components, and logic here. 
      This starter page is ready to go — just add your code below this template.
    </p>
    <button class="btn" onclick="alert('Start building Meditation Timer!')">Get Started</button>
  </div>
</body>
</html>
